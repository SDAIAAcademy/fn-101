<section>
<h2>Day 1: Read before you write</h2>
<ol>
<li><p>Salma keeps yesterday's readings before cleaning today's: before = rows, then rows.remove(-1.0), then rows = rows + [0.5]. The list started as [0.7, -1.0]. What is before now?</p><ul><li><b>A.</b> [0.7, -1.0]</li><li><b>B.</b> [0.7]</li><li><b>C.</b> [0.7, 0.5]</li><li><b>D.</b> [0.7, -1.0, 0.5]</li></ul></li>
<li><p>Shouq needs a function that counts the rows of a month with an empty consumption cell. Four colleagues propose one each. Which can be checked by a single assert, with no file on disk?</p><ul><li><b>A.</b> count_missing() opens the month's file and returns the count</li><li><b>B.</b> count_missing(rows) prints the count</li><li><b>C.</b> count_missing(rows) returns the count</li><li><b>D.</b> count_missing(rows) stores the count in a global named missing</li></ul></li>
<li><p>highest(lines) is annotated -&gt; float | None. A colleague writes peak = highest(lines) * 1.1 and the checker reports that None does not support *.</p><ul><li><b>A.</b> Keep the result in a name, test it is None first, then multiply</li><li><b>B.</b> Add # type: ignore to the line, since the files are never empty in practice</li><li><b>C.</b> Change the hint of highest to -&gt; float</li><li><b>D.</b> Write if not highest(lines) and return early</li></ul></li>
<li><p>A function counts the good rows. Placed so far: count = 0, the for line, the if line, count += 1. Left: return count. A test shows it returns 1 for 30 good rows.</p><ul><li><b>A.</b> Directly under count = 0, before the loop</li><li><b>B.</b> Under count += 1, at the same depth</li><li><b>C.</b> Under the if line, at the depth of the if</li><li><b>D.</b> After the loop, at the depth of the for line</li></ul></li>
<li><p>A script runs: week = [0.6, 0.7]; report = week; report.append(0.9); week = []. What does print(report) show?</p><ul><li><b>A.</b> [0.6, 0.7]</li><li><b>B.</b> []</li><li><b>C.</b> [0.6, 0.7, 0.9]</li><li><b>D.</b> An error, because week was emptied</li></ul></li>
<li><p>A record is meter = {"id": "M-0007", "days": [1.1]}. A colleague writes safe = dict(meter) and then safe["days"].append(2.2) and safe["id"] = "M-0008". What does meter hold now?</p><ul><li><b>A.</b> id M-0007 and days [1.1, 2.2]</li><li><b>B.</b> id M-0007 and days [1.1]</li><li><b>C.</b> id M-0008 and days [1.1, 2.2]</li><li><b>D.</b> id M-0008 and days [1.1]</li></ul></li>
<li><p>A file has count = 0 at the top and a function def bump(): count = 5. The script calls bump() and then prints count. What is printed, and why?</p><ul><li><b>A.</b> 5, because the function assigned a new value to count</li><li><b>B.</b> 0, because the assignment inside the function made a separate local name</li><li><b>C.</b> An error, because a function cannot assign to an outer name</li><li><b>D.</b> None, because bump returns nothing</li></ul></li>
<li><p>A function average(values) ends with print(total / len(values)). A caller writes mean = average([2.0, 4.0]) and then mean * 2. What happens?</p><ul><li><b>A.</b> The result is 6.0</li><li><b>B.</b> 3.0 is printed, then mean * 2 fails: mean is None</li><li><b>C.</b> Nothing is printed, then mean * 2 fails</li><li><b>D.</b> 3.0 is printed, then mean * 2 gives 6.0</li></ul></li>
<li><p>A colleague runs the type checker on a new file of five functions without any hints. It reports no issues, and she concludes the file has no type errors. What is the sound conclusion?</p><ul><li><b>A.</b> She is right: the checker reads all the code, hints or not</li><li><b>B.</b> Nothing: without hints there were no promises to check</li><li><b>C.</b> She is right, because strict mode is only for large projects</li><li><b>D.</b> The checker failed silently and should be run again</li></ul></li>
<li><p>parse_value returns a float, or None for an empty cell. Which test should a caller use to skip only the empty cells of a file in which some meters really read 0.0?</p><ul><li><b>A.</b> if not value:</li><li><b>B.</b> if value == "":</li><li><b>C.</b> if value is None:</li><li><b>D.</b> if value &lt; 0:</li></ul></li>
<li><p>You rebuild a function from scrambled lines and the test stops with NameError: name 'value' is not defined, pointing at the line 'if value &gt; 200:'. What does this tell you about your order?</p><ul><li><b>A.</b> A line is at the wrong indentation depth</li><li><b>B.</b> value is read before a line has bound it</li><li><b>C.</b> One of the distractors is still in the function</li><li><b>D.</b> The test passes the wrong argument</li></ul></li>
<li><p>A program runs: week = [0, 0]; month = [week, week]; month[0][1] = 5; print(month[1]). What is printed, and why?</p><ul><li><b>A.</b> [0, 5], because both items of month are the same list</li><li><b>B.</b> [0, 0], because only the first item was changed</li><li><b>C.</b> [5, 0], because the index 1 means the first position</li><li><b>D.</b> An error, because a list cannot hold a list twice</li></ul></li>
<li><p>A program runs: limit = 200, then a function def check(value): limit = 100; return value &gt; limit, then print(check(150), limit). What is printed?</p><ul><li><b>A.</b> False 200</li><li><b>B.</b> True 100</li><li><b>C.</b> False 100</li><li><b>D.</b> True 200</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Collections for data work</h2>
<ol>
<li><p>A function clean(rows) runs rows.sort() and returns rows[:10]. A caller writes top = clean(month). Afterwards, what is true of month?</p><ul><li><b>A.</b> It is unchanged: the function worked on its own copy</li><li><b>B.</b> It is sorted, and still has all its rows</li><li><b>C.</b> It is sorted and cut to ten rows</li><li><b>D.</b> It is the same object as top</li></ul></li>
<li><p>A colleague replaces the nested loop. Inside for reading in readings: the first line is now district_of = {m["meter_id"]: m["district"] for m in meters}, then a lookup. The counts are right; 100,000 rows still take seconds.</p><ul><li><b>A.</b> The index is rebuilt for every reading, which walks all the meters each time</li><li><b>B.</b> Dictionary lookups are slow when the dictionary has 600 keys</li><li><b>C.</b> Comprehensions are slower than loops</li><li><b>D.</b> 100,000 rows are too many for a Python loop</li></ul></li>
<li><p>Badr has the set ticketed (meter ids named in open tickets) and Salma the set flagged (meter ids with an anomaly). They want the meters that have an anomaly and no open ticket, to call those customers first.</p><ul><li><b>A.</b> ticketed &amp; flagged</li><li><b>B.</b> ticketed - flagged</li><li><b>C.</b> ticketed | flagged</li><li><b>D.</b> flagged - ticketed</li></ul></li>
<li><p>A script does values = read_values(path), then highest = max(values), then total = sum(values), and prints both. The file holds 100,000 good readings.</p><ul><li><b>A.</b> The right highest value and the right total</li><li><b>B.</b> The right highest value, then an error on the second line</li><li><b>C.</b> The right highest value and a total of 0</li><li><b>D.</b> A highest value of 0 and the right total</li></ul></li>
<li><p>Customer care works the most urgent tickets first and, within a priority, the oldest first. RANK gives urgent 0 and low 3. Which call is right?</p><ul><li><b>A.</b> sorted(waiting, key=lambda t: (t.priority, t.opened))</li><li><b>B.</b> sorted(waiting, key=lambda t: (RANK[t.priority], t.opened))</li><li><b>C.</b> sorted(waiting, key=lambda t: (RANK[t.priority], t.opened), reverse=True)</li><li><b>D.</b> sorted(waiting, key=lambda t: (t.opened, RANK[t.priority]))</li></ul></li>
<li><p>A loop over ticket lines runs counts[district] += 1 on an empty dictionary named counts. What happens at the first ticket?</p><ul><li><b>A.</b> The key is created with the value 1</li><li><b>B.</b> A KeyError: the key has no value yet</li><li><b>C.</b> The line is skipped for a key not yet seen</li><li><b>D.</b> The key is created with the value 0</li></ul></li>
<li><p>You must add the district to each of 2 million readings; the district is in a registry of 60,000 meters. Which plan finishes in seconds rather than hours?</p><ul><li><b>A.</b> For each reading, loop over the registry until the meter is found</li><li><b>B.</b> Sort the readings by meter id first, then loop over the registry for each reading</li><li><b>C.</b> Turn the readings into a set, then loop over the registry</li><li><b>D.</b> Build one dictionary from meter id to district, then do one lookup per reading</li></ul></li>
<li><p>A function returns the set of silent meter ids and a script writes them to a report in the order of a for loop over that set. A colleague notices the report differs between two runs on the same files. Why?</p><ul><li><b>A.</b> A set promises no order to a loop over it</li><li><b>B.</b> Sets drop some members when they are large</li><li><b>C.</b> The files were read in a different order</li><li><b>D.</b> The ids were added to the set in another order</li></ul></li>
<li><p>To find repeated readings you want to remember each (meter, date) you have seen. A colleague writes seen.add([meter_id, date]) and gets TypeError: unhashable type: 'list'. What is the repair?</p><ul><li><b>A.</b> Use seen.append in place of seen.add</li><li><b>B.</b> Convert the set to a list so that it accepts lists</li><li><b>C.</b> Add the tuple (meter_id, date) in place of the list</li><li><b>D.</b> Add the two values separately, first the meter id and then the date</li></ul></li>
<li><p>Which of these tasks on a readings file of 50 million rows needs the values in a list, not in a generator?</p><ul><li><b>A.</b> The total consumption</li><li><b>B.</b> The number of rows above 5 cubic metres</li><li><b>C.</b> The highest single reading</li><li><b>D.</b> The median reading</li></ul></li>
<li><p>read_rows(path) is a generator function whose first line prints 'opening'. A script runs rows = read_rows('missing.csv') for a file that does not exist, and nothing else. What is printed?</p><ul><li><b>A.</b> 'opening', then a FileNotFoundError</li><li><b>B.</b> Nothing: the body has not started yet</li><li><b>C.</b> A FileNotFoundError, and nothing else</li><li><b>D.</b> 'opening', and nothing else</li></ul></li>
<li><p>Ticket is a data class with frozen=True. A step of the pipeline runs ticket.status = 'closed' on a ticket it received. What happens, and what should the step do?</p><ul><li><b>A.</b> The status changes for every holder of the ticket; nothing else is needed</li><li><b>B.</b> The line is ignored without a message; the step should check the status afterwards</li><li><b>C.</b> A FrozenInstanceError is raised; the step should build a new record with the changed field</li><li><b>D.</b> A new ticket is created automatically and the old one is deleted</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Files, text and failure</h2>
<ol>
<li><p>For each of 17,690 rows you must decide whether its meter id is one of the 600 registered ids. Which choice keeps the whole job to one pass with one step per row?</p><ul><li><b>A.</b> A list of the registered ids, tested with in</li><li><b>B.</b> A sorted list of the registered ids, tested with in</li><li><b>C.</b> A set of the registered ids, tested with in</li><li><b>D.</b> A generator of the registered ids, tested with in</li></ul></li>
<li><p>A script loads tickets, logs each ticket it processes "for debugging", builds a summary and writes it to a file. The phone numbers must not leave the program. Where is masking applied?</p><ul><li><b>A.</b> In the function that writes the summary file</li><li><b>B.</b> Where each ticket line is first turned into a record</li><li><b>C.</b> In a second script that cleans the summary file afterwards</li><li><b>D.</b> Nowhere, if the file is only sent to colleagues</li></ul></li>
<li><p>A nightly file of 50,000 tickets is declared UTF-8. Tonight the load stops with a UnicodeDecodeError at one byte. Badr needs the queue in the morning.</p><ul><li><b>A.</b> Add errors="ignore" so that the load finishes</li><li><b>B.</b> Switch the whole file to Windows-1256, which never raises</li><li><b>C.</b> Refuse the file until the sender fixes it</li><li><b>D.</b> Load the lines that decode; report the rest by line and byte</li></ul></li>
<li><p>A colleague's intake finishes without a crash. Every line is in the rejection log with the reason UNKNOWN. The loop reads: try: accepted.append(parse_tiket(line)), then except Exception: rejected.append((line_no, "UNKNOWN", "")).</p><ul><li><b>A.</b> Every line of the file is malformed</li><li><b>B.</b> A typo raises NameError on every line; the wide except logs it</li><li><b>C.</b> The try is inside the loop and should be around it</li><li><b>D.</b> The file was opened with the wrong encoding</li></ul></li>
<li><p>The district report shows Al-Rabwa with twice the readings it should have. You can make it happen every time with one command on the month file. You have not opened the code yet.</p><ul><li><b>A.</b> Find the smallest input that still doubles: one district, a handful of rows</li><li><b>B.</b> Read the whole package from the top until something looks wrong</li><li><b>C.</b> Divide the count of that district by two in the report</li><li><b>D.</b> Write a regression test on the whole month file</li></ul></li>
<li><p>A script reads a readings file with csv.DictReader and computes total = total + row["consumption_m3"], with total starting at 0.0. What happens on the first row?</p><ul><li><b>A.</b> A TypeError: the cell is text, not a number</li><li><b>B.</b> The number is added, since the cell holds digits</li><li><b>C.</b> The text is appended, so total becomes a string</li><li><b>D.</b> The row is skipped because it is not a number</li></ul></li>
<li><p>A nightly script writes a JSON report that includes "generated_at" with the current time. A colleague compares the reports of two runs on the same input to check that nothing changed, and they always differ. What is the sound repair?</p><ul><li><b>A.</b> Compare the two files by size, not content</li><li><b>B.</b> Run the script only once a day</li><li><b>C.</b> Sort the keys of the JSON before writing</li><li><b>D.</b> Move the time from the report to the log</li></ul></li>
<li><p>A load stops with: UnicodeDecodeError: 'utf-8' codec can't decode byte 0xc7 in position 2184: invalid continuation byte. What does this tell you about the file?</p><ul><li><b>A.</b> The file ends after 2,184 bytes</li><li><b>B.</b> Byte 2,184 is not valid UTF-8</li><li><b>C.</b> The file has 2,184 lines of text</li><li><b>D.</b> The whole file is not UTF-8 at all</li></ul></li>
<li><p>A ticket report shows customer texts such as 'ط¹ط¯ط§ط¯' where Arabic words are expected. No error was raised anywhere. What most likely happened?</p><ul><li><b>A.</b> The customers typed these letters themselves</li><li><b>B.</b> The screen font lacks some Arabic letters</li><li><b>C.</b> UTF-8 bytes were read with a one-byte table</li><li><b>D.</b> The file was cut short while it was copied</li></ul></li>
<li><p>An intake of 5,000 ticket lines reports 4,950 accepted and 38 rejected, and exits normally. What should the next action be?</p><ul><li><b>A.</b> Ship the 4,950: the numbers are close enough</li><li><b>B.</b> Find the 12 lines that went nowhere</li><li><b>C.</b> Add 12 to the rejected count so the totals match</li><li><b>D.</b> Rerun the intake until the numbers add up</li></ul></li>
<li><p>A loader has one try around its whole for loop over 400 lines, with except Rejected adding the line to a log. Line 37 is malformed. How many lines end up accepted or logged?</p><ul><li><b>A.</b> 37: the loop ends at the first rejection</li><li><b>B.</b> 400: the except lets the loop continue</li><li><b>C.</b> 399: every line except the bad one</li><li><b>D.</b> 36: the bad line is not logged either</li></ul></li>
<li><p>A traceback has three frames: the module calling report(), report() calling total(), and total() at the line 'result += to_number(cell)', followed by 'TypeError: unsupported operand type(s) for +=: float and NoneType'. Where do you look first?</p><ul><li><b>A.</b> At the module line, the first in the traceback</li><li><b>B.</b> At to_number: when does it return None?</li><li><b>C.</b> At report(), the frame in the middle</li><li><b>D.</b> At total(), to add a try around the line</li></ul></li>
<li><p>You fixed a defect and wrote a regression test, which passes. A reviewer asks how you know the test guards against the defect. What is the strongest answer?</p><ul><li><b>A.</b> Its name says it is a regression test</li><li><b>B.</b> It passes on the fixed code</li><li><b>C.</b> It covers the function that was changed</li><li><b>D.</b> It failed before the fix and passes after</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: From notebook to tool</h2>
<ol>
<li><p>An intake reads 435 ticket lines. A broken line must be recorded with its reason, and the lines after it must still be read. Where does the try belong?</p><ul><li><b>A.</b> Around the whole loop over the lines</li><li><b>B.</b> Inside the loop, around the one call that parses one line</li><li><b>C.</b> Around the call of the intake function, in the script</li><li><b>D.</b> Inside the loop, with except: pass to keep going</li></ul></li>
<li><p>Every Sunday the branch offices send a ticket file. It must be decoded, checked and turned into a rejection log before the customer care team starts work. Nobody watches it run.</p><ul><li><b>A.</b> A notebook that the analyst on duty opens and runs each Sunday</li><li><b>B.</b> A module with the decoding and checking functions, and nothing else</li><li><b>C.</b> A script with one command, built on functions that live in a module</li><li><b>D.</b> A notebook, because the outputs stay visible under each cell</li></ul></li>
<li><p>A colleague's file monthly.py defines three functions and ends with the line main(). A test file starts with from monthly import clean. Running the tests reads the month file and prints the whole report before any test starts.</p><ul><li><b>A.</b> pytest calls every function it finds in an imported file</li><li><b>B.</b> Importing runs the file's top level, and the call of main() is at the top level</li><li><b>C.</b> Importing clean also imports main, and imported functions run once</li><li><b>D.</b> The file has no __main__.py beside it</li></ul></li>
<li><p>Someone "tidies" the rule and writes value &gt;= factor * median(history) where it said &gt;. Which test fails?</p><ul><li><b>A.</b> The value 5.0 with the history 1, 1, 1 is an anomaly</li><li><b>B.</b> The value 1.1 with the history 1, 1, 1 is not an anomaly</li><li><b>C.</b> The value 100.0 with an empty history is not an anomaly</li><li><b>D.</b> The value 3.0 with the history 1, 1, 1 is not an anomaly</li></ul></li>
<li><p>You are learning. A report shows the same count for every district. You have reproduced it and have no idea yet where it comes from. An assistant is open in the next window.</p><ul><li><b>A.</b> Paste the package and ask for the corrected file</li><li><b>B.</b> Paste the package and ask which line is wrong, then fix it yourself</li><li><b>C.</b> Shrink it to a case built by hand, write a first guess, then ask for one hint on what to check</li><li><b>D.</b> Close the assistant and never use it for debugging</li></ul></li>
<li><p>A colleague sends a saved notebook. Reading down the page, the numbers beside its five code cells are 1, 2, 6, 7 and 5. What does this tell you before you run anything?</p><ul><li><b>A.</b> The last cell ran before the two above it last ran</li><li><b>B.</b> The notebook has seven cells and two are hidden</li><li><b>C.</b> The third cell took the longest of all to run</li><li><b>D.</b> It was run top to bottom, and some cells twice</li></ul></li>
<li><p>An analyst's notebook has produced the monthly figures for weeks. A colleague opens the same file, chooses 'restart and run all', and the third cell stops with NameError: name 'limits' is not defined. No cell on the page defines limits. What is the most likely history?</p><ul><li><b>A.</b> The colleague's Python is an older version</li><li><b>B.</b> The file was damaged when it was sent</li><li><b>C.</b> A deleted cell defined limits in her kernel</li><li><b>D.</b> limits is a setting of the analyst's install</li></ul></li>
<li><p>Three programs at a utility need the same rule for deciding whether a meter reading is valid: the monthly report, a ticket tool, and a data-quality dashboard. Each currently has its own copy, and the copies have started to differ. Where should the rule live?</p><ul><li><b>A.</b> In a notebook that all three teams open</li><li><b>B.</b> In the script of the monthly report, since it was written there first</li><li><b>C.</b> In each program, with a comment that says the copies must be kept the same</li><li><b>D.</b> In a module that the three programs import, with its tests beside it</li></ul></li>
<li><p>A scheduled job runs a reporting tool every night and mails the report if the tool succeeded. One night the input file was missing; the tool printed 'no such file', wrote nothing, and the job mailed last night's report again as if it were new. What was missing in the tool?</p><ul><li><b>A.</b> A clearer error message for the operator</li><li><b>B.</b> A try around the whole program</li><li><b>C.</b> A non-zero exit code on failure</li><li><b>D.</b> A log file that records each run</li></ul></li>
<li><p>A command-line tool builds a district report from a month of readings. Run twice on the same files, it writes two reports whose districts appear in a different order. The numbers are the same. Why does this still need repair, and how?</p><ul><li><b>A.</b> No repair: the numbers are the same</li><li><b>B.</b> The reports should be compared by eye</li><li><b>C.</b> Run the tool only once per month</li><li><b>D.</b> Write the districts in sorted order</li></ul></li>
<li><p>A tool writes its report to a file and also prints progress lines such as 'loading', 'validating' and each rejected customer's ticket text. It will soon run unattended, and its output will be kept. Which change is the sound one?</p><ul><li><b>A.</b> Log with levels: counts and file names, no customer text</li><li><b>B.</b> Leave the prints, since nobody will read them</li><li><b>C.</b> Remove every message so the tool is always silent</li><li><b>D.</b> Print the messages into the report file as well</li></ul></li>
<li><p>A discount rule says: orders of more than 100 riyals get free delivery. The tests check an order of 30 (no free delivery) and one of 500 (free delivery), and pass. A change turns 'more than' into 'at least'. What happens, and which test was missing?</p><ul><li><b>A.</b> The tests fail, since the rule changed</li><li><b>B.</b> The tests still pass; a test for an order of exactly 100 was missing</li><li><b>C.</b> The tests still pass; a test for an order of 0 was missing</li><li><b>D.</b> The tests still pass; more tests in the middle, such as 50 and 60, were missing</li></ul></li>
<li><p>A function has twelve tests, and all pass. A colleague concludes: 'The function is correct.' Which statement is the accurate one?</p><ul><li><b>A.</b> It is right on those twelve examples</li><li><b>B.</b> Correct, since there are more than ten tests</li><li><b>C.</b> Nothing at all can be concluded from tests</li><li><b>D.</b> Correct, if the type checker is also clean</li></ul></li>
<li><p>A trainee is learning to debug. A function returns a wrong total; the trainee has reproduced it with three numbers and suspects the loop. An AI assistant is available. Which request best keeps the skill being learnt with the trainee?</p><ul><li><b>A.</b> 'Rewrite this function so that it gives the right total.'</li><li><b>B.</b> 'Which line of this function is wrong? I will fix it myself.'</li><li><b>C.</b> '1, 2, 3 gives 5, not 6; I think the loop skips one. What could I print?'</li><li><b>D.</b> 'Write tests for this function so that I can find the bug.'</li></ul></li>
<li><p>An analyst at a utility is debugging a script that crashes on one customer's ticket. To get help, the analyst is about to paste the script and the ticket, with the customer's name, phone number and complaint, into a public AI assistant. What is the sound way to get the same help?</p><ul><li><b>A.</b> Paste it: it is only one customer</li><li><b>B.</b> Paste it, then ask it to forget the ticket</li><li><b>C.</b> Paste it after removing the name only</li><li><b>D.</b> Ask about a small invented input instead</li></ul></li>
<li><p>A metering analyst receives a file format she has never seen and wants to find out, today, which of its forty columns are filled and what the values look like. She does not know yet whether she will ever do it again. Which home fits the task?</p><ul><li><b>A.</b> A module with one function per column, and tests</li><li><b>B.</b> A script with arguments for the file and the columns</li><li><b>C.</b> A notebook: she is looking, one step at a time</li><li><b>D.</b> A package with a command-line entry point</li></ul></li>
<li><p>A team's weekly figures come from a notebook that one analyst runs by hand. Twice this quarter the figures were wrong because a cell had been skipped. The steps have not changed for months. What is the sound next move?</p><ul><li><b>A.</b> Add a note at the top: run all cells in order</li><li><b>B.</b> Have a second analyst run it and compare</li><li><b>C.</b> Restart and run all before every weekly run</li><li><b>D.</b> Move the steps into a module and a script</li></ul></li>
<li><p>A reporting tool has the threshold 3.0 written inside a function. Analysts sometimes need 2.5, and each time someone edits the file, runs it, and forgets to change it back. What should the tool offer?</p><ul><li><b>A.</b> An argument --factor with 3.0 as its default, shown by --help</li><li><b>B.</b> A second copy of the tool with 2.5 in it</li><li><b>C.</b> A question that the tool asks on every run, waiting for an answer</li><li><b>D.</b> A comment beside the number that says: remember to change it back</li></ul></li>
</ol>
