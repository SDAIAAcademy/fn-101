e the hint of highest to -> float"},{"key":"D","text":"Write if not highest(lines) and return early"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The hint says a missing value is possible. Only the caller knows what to do then, and the checker makes sure the question is answered.","misconceptions":["","Silences the report and keeps the crash: an empty file still multiplies None at run time","Changes the promise to fit the caller: the function still returns None for an empty file, now without warning anyone","Treats zero as missing: a month whose highest reading is 0.0 would be handled as if there were no readings"],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-optional-return","title":"The checker rejects this line. What is the right repair?"},"level":null,"pool":"checkpoint"},{"id":"check-parsons-order-q1","type":"single","prompt":"A function counts the good rows. Placed so far: count = 0, the for line, the if line, count += 1. Left: return count. A test shows it returns 1 for 30 good rows.","options":[{"key":"A","text":"Directly under count = 0, before the loop"},{"key":"B","text":"Under count += 1, at the same depth"},{"key":"C","text":"Under the if line, at the depth of the if"},{"key":"D","text":"After the loop, at the depth of the for line"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A result that depends on every row is returned once, after the loop. A return of 1 for 30 good rows says the return sits inside the loop.","misconceptions":["Puts the result before the work: count is still 0 here and the loop below never runs","Returns from inside the branch: the function ends at the first good row, which is the reported 1","Returns from inside the loop: the function ends after the first row, whatever it is",""],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-parsons-order","title":"Where does the last line of the function go?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"A function clean(rows) runs rows.sort() and returns rows[:10]. A caller writes top = clean(month). Afterwards, what is true of month?","options":[{"key":"A","text":"It is unchanged: the function worked on its own copy"},{"key":"B","text":"It is sorted, and still has all its rows"},{"key":"C","text":"It is sorted and cut to ten rows"},{"key":"D","text":"It is the same object as top"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"sort() mutates the caller's list; the slice makes a new one. A function that returns a result and also changes its argument surprises every caller.","misconceptions":["Believes a call copies its argument: the parameter and month name one list","","Treats the slice as a change in place: a slice builds a new list and leaves the original whole","Treats the returned slice as the same object as the argument: top is a new list"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"One list or two?"},"level":null,"pool":"checkpoint"},{"id":"check-index-outside-loop-q1","type":"single","prompt":"A colleague replaces the nested loop. Inside for reading in readings: the first line is now district_of = {m[\"meter_id\"]: m[\"district\"] for m in meters}, then a lookup. The counts are right; 100,000 rows still take seconds.","options":[{"key":"A","text":"The index is rebuilt for every reading, which walks all the meters each time"},{"key":"B","text":"Dictionary lookups are slow when the dictionary has 600 keys"},{"key":"C","text":"Comprehensions are slower than loops"},{"key":"D","text":"100,000 rows are too many for a Python loop"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Building the index walks 600 meters. Inside the loop that happens 100,000 times: the loop inside a loop is back, hidden in one line. Build it once, before the loop.","misconceptions":["","Blames the fast part: a lookup costs the same whatever the size of the dictionary","Blames the syntax: a comprehension does the same work as the loop it replaces","Blames the data: the readings are walked once in both versions, and that part is cheap"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-index-outside-loop","title":"Why is this version still slow?"},"level":null,"pool":"checkpoint"},{"id":"check-set-difference-q1","type":"single","prompt":"Badr has the set ticketed (meter ids named in open tickets) and Salma the set flagged (meter ids with an anomaly). They want the meters that have an anomaly and no open ticket, to call those customers first.","options":[{"key":"A","text":"ticketed & flagged"},{"key":"B","text":"ticketed - flagged"},{"key":"C","text":"ticketed | flagged"},{"key":"D","text":"flagged - ticketed"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Start from what you want to keep (flagged) and take away what disqualifies (ticketed). Difference is not symmetric: the order says which side survives.","misconceptions":["Takes the shared part: these meters have an anomaly and a ticket already","Subtracts the wrong way round: these have a ticket and no anomaly","Joins everything: this is every meter that has either",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-set-difference","title":"Which expression finds them?"},"level":null,"pool":"checkpoint"},{"id":"check-generator-twice-q1","type":"single","prompt":"A script does values = read_values(path), then highest = max(values), then total = sum(values), and prints both. The file holds 100,000 good readings.","options":[{"key":"A","text":"The right highest value and the right total"},{"key":"B","text":"The right highest value, then an error on the second line"},{"key":"C","text":"The right highest value and a total of 0"},{"key":"D","text":"A highest value of 0 and the right total"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"max walks the generator to its end. sum then receives nothing and returns 0, without any error.","misconceptions":["Treats the generator as a list that can be walked again","Expects an error where Python gives a quiet result for no data","","Believes the first call consumed nothing because it only looked for one value"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-generator-twice","title":"What does the report show?"},"level":null,"pool":"checkpoint"},{"id":"check-sort-key-q1","type":"single","prompt":"Customer care works the most urgent tickets first and, within a priority, the oldest first. RANK gives urgent 0 and low 3. Which call is right?","options":[{"key":"A","text":"sorted(waiting, key=lambda t: (t.priority, t.opened))"},{"key":"B","text":"sorted(waiting, key=lambda t: (RANK[t.priority], t.opened))"},{"key":"C","text":"sorted(waiting, key=lambda t: (RANK[t.priority], t.opened), reverse=True)"},{"key":"D","text":"sorted(waiting, key=lambda t: (t.opened, RANK[t.priority]))"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The tuple is compared item by item: rank decides, and the date decides only between tickets of the same rank. Smaller comes first, so 0 and the earliest date lead.","misconceptions":["Sorts by the text of the priority: alphabetical order puts high before urgent","","Reverses both fields at once: low priority first and, within it, the newest first","Puts age before priority: a low ticket from August would come before an urgent one from September"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-sort-key","title":"Which key puts the queue in working order?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"For each of 17,690 rows you must decide whether its meter id is one of the 600 registered ids. Which choice keeps the whole job to one pass with one step per row?","options":[{"key":"A","text":"A list of the registered ids, tested with in"},{"key":"B","text":"A sorted list of the registered ids, tested with in"},{"key":"C","text":"A set of the registered ids, tested with in"},{"key":"D","text":"A generator of the registered ids, tested with in"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A set answers membership in one step whatever its size. This is the known argument of every validation function this week.","misconceptions":["Searches up to 600 ids for every row: the loop inside a loop of yesterday's timing","Sorting makes the list tidy, and in on a list still walks it item by item","","A generator can be walked once: the second row would find it empty"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"Which collection answers the question?"},"level":null,"pool":"checkpoint"},{"id":"check-mask-where-q1","type":"single","prompt":"A script loads tickets, logs each ticket it processes \"for debugging\", builds a summary and writes it to a file. The phone numbers must not leave the program. Where is masking applied?","options":[{"key":"A","text":"In the function that writes the summary file"},{"key":"B","text":"Where each ticket line is first turned into a record"},{"key":"C","text":"In a second script that cleans the summary file afterwards"},{"key":"D","text":"Nowhere, if the file is only sent to colleagues"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Everything downstream, the log included, can only leak what it was given. Mask or drop at the door, and no later line can get it wrong.","misconceptions":["Protects one output and forgets the other: the log line has already carried the number out","","Repairs after the leak: the file existed with the numbers in it, on disk and perhaps in a backup","Relies on readers to behave: an output that holds the number has disclosed it, whoever opens it"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-mask-where","title":"Where does the masking go?"},"level":null,"pool":"checkpoint"},{"id":"check-decode-choice-q1","type":"single","prompt":"A nightly file of 50,000 tickets is declared UTF-8. Tonight the load stops with a UnicodeDecodeError at one byte. Badr needs the queue in the morning.","options":[{"key":"A","text":"Add errors=\"ignore\" so that the load finishes"},{"key":"B","text":"Switch the whole file to Windows-1256, which never raises"},{"key":"C","text":"Refuse the file until the sender fixes it"},{"key":"D","text":"Load the lines that decode; report the rest by line and byte"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The good lines are good. The bad ones are few, and a report that says which and where lets someone repair them at the source. Nothing is lost and nothing is invented.","misconceptions":["Trades a loud failure for a silent one: the tickets load with parts of their text deleted and nobody is told","Guesses a table that raises nothing: the 50,000 good tickets would load as unreadable text","Stops everything for a few lines: thousands of good tickets wait for a problem that concerns a handful",""],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-decode-choice","title":"The export fails on a few lines. What do you do?"},"level":null,"pool":"checkpoint"},{"id":"check-except-scope-q1","type":"single","prompt":"A colleague's intake finishes without a crash. Every line is in the rejection log with the reason UNKNOWN. The loop reads: try: accepted.append(parse_tiket(line)), then except Exception: rejected.append((line_no, \"UNKNOWN\", \"\")).","options":[{"key":"A","text":"Every line of the file is malformed"},{"key":"B","text":"A typo raises NameError on every line; the wide except logs it"},{"key":"C","text":"The try is inside the loop and should be around it"},{"key":"D","text":"The file was opened with the wrong encoding"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"except Exception cannot tell a bad line from a bad program. With except Rejected the first line would have stopped the run with a NameError that names the typo.","misconceptions":["Blames the data: 400 of the lines are known to be good","","Blames the position of the try: inside the loop is right, which is why all 435 lines were reached","Blames the file's encoding: a decode error would stop the read before any line was handled"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-except-scope","title":"The log says 435 rejected and 0 accepted. Why?"},"level":null,"pool":"checkpoint"},{"id":"check-debug-next-step-q1","type":"single","prompt":"The district report shows Al-Rabwa with twice the readings it should have. You can make it happen every time with one command on the month file. You have not opened the code yet.","options":[{"key":"A","text":"Find the smallest input that still doubles: one district, a handful of rows"},{"key":"B","text":"Read the whole package from the top until something looks wrong"},{"key":"C","text":"Divide the count of that district by two in the report"},{"key":"D","text":"Write a regression test on the whole month file"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Reproduce is done. Shrink comes next: a case small enough to check by hand turns the search into a short one, and becomes the regression test.","misconceptions":["","Skips shrinking and guessing: reading 300 lines without a question finds whatever looks odd, not the cause","Fixes the symptom at the output: the count is still wrong inside, and wrong for every other use of it","Writes the test before knowing the case: on 17,690 rows it would be slow and would not say what is wrong"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-debug-next-step","title":"What is the next step?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"An intake reads 435 ticket lines. A broken line must be recorded with its reason, and the lines after it must still be read. Where does the try belong?","options":[{"key":"A","text":"Around the whole loop over the lines"},{"key":"B","text":"Inside the loop, around the one call that parses one line"},{"key":"C","text":"Around the call of the intake function, in the script"},{"key":"D","text":"Inside the loop, with except: pass to keep going"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The handler sits where the decision is: one line failed, record it, go on. Accepted plus rejected then equals the lines of the input.","misconceptions":["The first broken line ends the whole loop: one rejection, and the lines after it are never read","","The loop is still stopped by the first error; the handler only decides what is printed at the end","A handler with nothing in it is passing silently: the line disappears without a reason"],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Where does the try go?"},"level":null,"pool":"checkpoint"},{"id":"check-notebook-home-q1","type":"single","prompt":"Every Sunday the branch offices send a ticket file. It must be decoded, checked and turned into a rejection log before the customer care team starts work. Nobody watches it run.","options":[{"key":"A","text":"A notebook that the analyst on duty opens and runs each Sunday"},{"key":"B","text":"A module with the decoding and checking functions, and nothing else"},{"key":"C","text":"A script with one command, built on functions that live in a module"},{"key":"D","text":"A notebook, because the outputs stay visible under each cell"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"It repeats, on new input, without a person: a script. The functions it calls are needed by the tests too, so they live in a module.","misconceptions":["A notebook needs a person to open it and run its cells, and its result depends on what that person ran before","A module runs nothing by itself: something still has to call its functions every Sunday","","Keeping the outputs on a page is useful for a question asked once; here the output is a log file that other people open"],"lo":["LO2"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-notebook-home","title":"Which home for this task?"},"level":null,"pool":"checkpoint"},{"id":"check-entry-point-q1","type":"single","prompt":"A colleague's file monthly.py defines three functions and ends with the line main(). A test file starts with from monthly import clean. Running the tests reads the month file and prints the whole report before any test starts.","options":[{"key":"A","text":"pytest calls every function it finds in an imported file"},{"key":"B","text":"Importing runs the file's top level, and the call of main() is at the top level"},{"key":"C","text":"Importing clean also imports main, and imported functions run once"},{"key":"D","text":"The file has no __main__.py beside it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An import runs every top-level line. Put the call under if __name__ == \"__main__\": and the file can be both imported and run.","misconceptions":["pytest runs functions whose names start with test_; main is not one of them","","Importing one name still runs the whole file first; the name is picked out afterwards","The file needs no entry point to be imported; the trouble is the unguarded call at its end"],"lo":["LO6"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-entry-point","title":"The test run prints a report. Why?"},"level":null,"pool":"checkpoint"},{"id":"check-which-test-q1","type":"single","prompt":"Someone \"tidies\" the rule and writes value >= factor * median(history) where it said >. Which test fails?","options":[{"key":"A","text":"The value 5.0 with the history 1, 1, 1 is an anomaly"},{"key":"B","text":"The value 1.1 with the history 1, 1, 1 is not an anomaly"},{"key":"C","text":"The value 100.0 with an empty history is not an anomaly"},{"key":"D","text":"The value 3.0 with the history 1, 1, 1 is not an anomaly"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The two rules differ at one point, where the value equals factor times the median. Only an example on that point can tell them apart.","misconceptions":["5.0 is far above 3.0: both rules answer True, so the test passes on the wrong one as well","1.1 is far below 3.0: both rules answer False","An empty history returns before the comparison is reached, in both versions",""],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-which-test","title":"Which test would catch it?"},"level":null,"pool":"checkpoint"},{"id":"check-hint-or-answer-q1","type":"single","prompt":"You are learning. A report shows the same count for every district. You have reproduced it and have no idea yet where it comes from. An assistant is open in the next window.","options":[{"key":"A","text":"Paste the package and ask for the corrected file"},{"key":"B","text":"Paste the package and ask which line is wrong, then fix it yourself"},{"key":"C","text":"Shrink it to a case built by hand, write a first guess, then ask for one hint on what to check"},{"key":"D","text":"Close the assistant and never use it for debugging"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Attempt, hint, explain. The attempt makes the hint yours to use, and the shrunk case holds no data you should not send.","misconceptions":["The defect is repaired and the method was skipped: next time, without the assistant, you start from the same place","Better than pasting the fix, and still the assistant's hypothesis, not yours: you skip the step the study found weakest","","Refusing help forever is not the lesson: a hint after an honest attempt costs little and teaches a lot"],"lo":["LO5"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-hint-or-answer","title":"What do you do next?"},"level":null,"pool":"checkpoint"},{"id":"q-d1-alias-append","type":"single","prompt":"A script runs: week = [0.6, 0.7]; report = week; report.append(0.9); week = []. What does print(report) show?","options":[{"key":"A","text":"[0.6, 0.7]"},{"key":"B","text":"[]"},{"key":"C","text":"[0.6, 0.7, 0.9]"},{"key":"D","text":"An error, because week was emptied"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"report and week named one list when 0.9 was appended; the last line only ties week to a new empty list, and report still names the old one.","misconceptions":["Treats report = week as a copy made before the append","Treats week = [] as emptying the list that report also names","","Expects a name that was rebound to break the other name"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-shallow-copy","type":"single","prompt":"A record is meter = {\"id\": \"M-0007\", \"days\": [1.1]}. A colleague writes safe = dict(meter) and then safe[\"days\"].append(2.2) and safe[\"id\"] = \"M-0008\". What does meter hold now?","options":[{"key":"A","text":"id M-0007 and days [1.1, 2.2]"},{"key":"B","text":"id M-0007 and days [1.1]"},{"key":"C","text":"id M-0008 and days [1.1, 2.2]"},{"key":"D","text":"id M-0008 and days [1.1]"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"dict(meter) makes a new outer dictionary, so the id is separate, but both dictionaries point at the same inner list.","misconceptions":["","Assumes a copy is copied all the way down","Assumes dict(meter) is a second name for the same dictionary","Applies the two rules the wrong way round"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-scope-local","type":"single","prompt":"A file has count = 0 at the top and a function def bump(): count = 5. The script calls bump() and then prints count. What is printed, and why?","options":[{"key":"A","text":"5, because the function assigned a new value to count"},{"key":"B","text":"0, because the assignment inside the function made a separate local name"},{"key":"C","text":"An error, because a function cannot assign to an outer name"},{"key":"D","text":"None, because bump returns nothing"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Assigning to a name inside a function binds a local name for that call; the outer count is never touched.","misconceptions":["Believes assignment inside a function reaches the outer name","","Confuses 'does not reach' with 'is forbidden'","Confuses the value of the call with the value of the name"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-print-vs-return","type":"single","prompt":"A function average(values) ends with print(total / len(values)). A caller writes mean = average([2.0, 4.0]) and then mean * 2. What happens?","options":[{"key":"A","text":"The result is 6.0"},{"key":"B","text":"3.0 is printed, then mean * 2 fails: mean is None"},{"key":"C","text":"Nothing is printed, then mean * 2 fails"},{"key":"D","text":"3.0 is printed, then mean * 2 gives 6.0"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The function prints and returns nothing, so the call's value is None; None cannot be multiplied.","misconceptions":["Treats the printed value as the returned one","","Expects a function to print only when its result is used","Treats print as a return that also shows the value"],"lo":["LO3"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-checker-clean","type":"single","prompt":"A colleague runs the type checker on a new file of five functions without any hints. It reports no issues, and she concludes the file has no type errors. What is the sound conclusion?","options":[{"key":"A","text":"She is right: the checker reads all the code, hints or not"},{"key":"B","text":"Nothing: without hints there were no promises to check"},{"key":"C","text":"She is right, because strict mode is only for large projects"},{"key":"D","text":"The checker failed silently and should be run again"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"By default the checker examines annotated functions; on code without hints a clean report carries no information, which is why strict mode refuses unannotated functions.","misconceptions":["Believes the checker infers every promise by itself","","Thinks strict mode is about project size, not about refusing unannotated functions","Blames the tool for doing what its default says"],"lo":["LO3"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-none-zero","type":"single","prompt":"parse_value returns a float, or None for an empty cell. Which test should a caller use to skip only the empty cells of a file in which some meters really read 0.0?","options":[{"key":"A","text":"if not value:"},{"key":"B","text":"if value == \"\":"},{"key":"C","text":"if value is None:"},{"key":"D","text":"if value \u003c 0:"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Only 'is None' asks whether the value is missing; 'not value' is also true for 0.0, a real reading.","misconceptions":["Treats zero and missing as the same thing","Tests the text, but the function has already turned it into None","","Tests the range, which says nothing about a missing value and fails on None"],"lo":["LO3"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d1-parsons-nameerror","type":"single","prompt":"You rebuild a function from scrambled lines and the test stops with NameError: name 'value' is not defined, pointing at the line 'if value > 200:'. What does this tell you about your order?","options":[{"key":"A","text":"A line is at the wrong indentation depth"},{"key":"B","text":"value is read before a line has bound it"},{"key":"C","text":"One of the distractors is still in the function"},{"key":"D","text":"The test passes the wrong argument"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A NameError means the name was read before any line bound it: an order mistake, and the message names the name to look for.","misconceptions":["Confuses a NameError with an IndentationError","","Guesses at the cause without using the message","Blames the caller: a wrong argument gives a wrong value, not an unbound name"],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-count-keyerror","type":"single","prompt":"A loop over ticket lines runs counts[district] += 1 on an empty dictionary named counts. What happens at the first ticket?","options":[{"key":"A","text":"The key is created with the value 1"},{"key":"B","text":"A KeyError: the key has no value yet"},{"key":"C","text":"The line is skipped for a key not yet seen"},{"key":"D","text":"The key is created with the value 0"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"+= reads the old value first; for a key that is not there the read fails. counts.get(district, 0) + 1 supplies the 0.","misconceptions":["Assumes a dictionary invents a starting value","","Assumes a missing key is ignored without a word","Assumes += creates the key before adding to it"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-join-choice","type":"single","prompt":"You must add the district to each of 2 million readings; the district is in a registry of 60,000 meters. Which plan finishes in seconds rather than hours?","options":[{"key":"A","text":"For each reading, loop over the registry until the meter is found"},{"key":"B","text":"Sort the readings by meter id first, then loop over the registry for each reading"},{"key":"C","text":"Turn the readings into a set, then loop over the registry"},{"key":"D","text":"Build one dictionary from meter id to district, then do one lookup per reading"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The index is built once from 60,000 meters; each of the 2 million readings then costs one lookup instead of a search through the registry.","misconceptions":["Repeats a search of up to 60,000 steps 2 million times","Sorting the readings does not remove the search inside the loop","A set of readings answers no question about districts",""],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-set-order","type":"single","prompt":"A function returns the set of silent meter ids and a script writes them to a report in the order of a for loop over that set. A colleague notices the report differs between two runs on the same files. Why?","options":[{"key":"A","text":"A set promises no order to a loop over it"},{"key":"B","text":"Sets drop some members when they are large"},{"key":"C","text":"The files were read in a different order"},{"key":"D","text":"The ids were added to the set in another order"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A set promises membership, not order; sorting it before writing gives the same report every time.","misconceptions":["","Confuses 'no order' with 'not reliable'","Blames the input, which did not change","Expects a set to keep the order of insertion, as a dictionary does"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-tuple-key","type":"single","prompt":"To find repeated readings you want to remember each (meter, date) you have seen. A colleague writes seen.add([meter_id, date]) and gets TypeError: unhashable type: 'list'. What is the repair?","options":[{"key":"A","text":"Use seen.append in place of seen.add"},{"key":"B","text":"Convert the set to a list so that it accepts lists"},{"key":"C","text":"Add the tuple (meter_id, date) in place of the list"},{"key":"D","text":"Add the two values separately, first the meter id and then the date"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A member of a set must never change, so it must be immutable: a tuple of the two values is, a list is not.","misconceptions":["A set has no append, and the problem is the member, not the method","A list of seen pairs brings back the slow search","","Loses the pairing: the set would then say that the meter and the date were each seen, not together"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-generator-or-list","type":"single","prompt":"Which of these tasks on a readings file of 50 million rows needs the values in a list, not in a generator?","options":[{"key":"A","text":"The total consumption"},{"key":"B","text":"The number of rows above 5 cubic metres"},{"key":"C","text":"The highest single reading"},{"key":"D","text":"The median reading"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A median needs the values in order, so all of them must be held and sorted; the other three can be kept as one running number while the rows pass.","misconceptions":["A total needs one running sum","A count needs one running number","A maximum needs one running best value",""],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-lazy-call","type":"single","prompt":"read_rows(path) is a generator function whose first line prints 'opening'. A script runs rows = read_rows('missing.csv') for a file that does not exist, and nothing else. What is printed?","options":[{"key":"A","text":"'opening', then a FileNotFoundError"},{"key":"B","text":"Nothing: the body has not started yet"},{"key":"C","text":"A FileNotFoundError, and nothing else"},{"key":"D","text":"'opening', and nothing else"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Calling a generator function only creates the generator; its body, including the print and the open, runs at the first request for a value.","misconceptions":["Treats the call as running the function","","Expects the open to be tried at the call","Expects the first line to run at the call"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d2-frozen","type":"single","prompt":"Ticket is a data class with frozen=True. A step of the pipeline runs ticket.status = 'closed' on a ticket it received. What happens, and what should the step do?","options":[{"key":"A","text":"The status changes for every holder of the ticket; nothing else is needed"},{"key":"B","text":"The line is ignored without a message; the step should check the status afterwards"},{"key":"C","text":"A FrozenInstanceError is raised; the step should build a new record with the changed field"},{"key":"D","text":"A new ticket is created automatically and the old one is deleted"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A frozen record refuses assignment; dataclasses.replace(ticket, status='closed') returns a new record and leaves the shared one as it was.","misconceptions":["Describes a mutable record, which frozen=True prevents","Assumes a refused change is silent","","Assumes the language replaces records by itself"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-csv-text","type":"single","prompt":"A script reads a readings file with csv.DictReader and computes total = total + row[\"consumption_m3\"], with total starting at 0.0. What happens on the first row?","options":[{"key":"A","text":"A TypeError: the cell is text, not a number"},{"key":"B","text":"The number is added, since the cell holds digits"},{"key":"C","text":"The text is appended, so total becomes a string"},{"key":"D","text":"The row is skipped because it is not a number"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A CSV reader returns every cell as text; adding text to a float raises a TypeError until the cell is converted with float.","misconceptions":["","Assumes the reader converts cells that look like numbers","Assumes Python turns the number into text to make the addition work","Expects a failed addition to skip the row quietly instead of raising"],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-json-reproducible","type":"single","prompt":"A nightly script writes a JSON report that includes \"generated_at\" with the current time. A colleague compares the reports of two runs on the same input to check that nothing changed, and they always differ. What is the sound repair?","options":[{"key":"A","text":"Compare the two files by size, not content"},{"key":"B","text":"Run the script only once a day"},{"key":"C","text":"Sort the keys of the JSON before writing"},{"key":"D","text":"Move the time from the report to the log"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A report that holds the time of the run can never be equal on two runs; moving the time to the log makes 'same input, same bytes' checkable.","misconceptions":["Two different reports can have the same size","Avoids the comparison instead of making it possible","Fixes the order of keys, which was not what differed",""],"lo":["LO6"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-decode-error-read","type":"single","prompt":"A load stops with: UnicodeDecodeError: 'utf-8' codec can't decode byte 0xc7 in position 2184: invalid continuation byte. What does this tell you about the file?","options":[{"key":"A","text":"The file ends after 2,184 bytes"},{"key":"B","text":"Byte 2,184 is not valid UTF-8"},{"key":"C","text":"The file has 2,184 lines of text"},{"key":"D","text":"The whole file is not UTF-8 at all"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The message names the codec in use, the byte it could not decode and where; everything before that position decoded, so most likely a part of the file was written in another encoding.","misconceptions":["Reads the position as an end, not as the place of one bad byte","","Confuses a byte position with a line count","Jumps from one undecodable byte to the whole file"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-mojibake","type":"single","prompt":"A ticket report shows customer texts such as 'ط¹ط¯ط§ط¯' where Arabic words are expected. No error was raised anywhere. What most likely happened?","options":[{"key":"A","text":"The customers typed these letters themselves"},{"key":"B","text":"The screen font lacks some Arabic letters"},{"key":"C","text":"UTF-8 bytes were read with a one-byte table"},{"key":"D","text":"The file was cut short while it was copied"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A one-byte table has a character for almost every byte, so decoding UTF-8 with it succeeds and produces two wrong characters for each Arabic letter.","misconceptions":["Blames the input for a pattern that is the signature of a wrong decoding","A missing font shows boxes, not a regular pattern of other letters","","Truncation shortens text; it does not change its letters"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-rejection-accounting","type":"single","prompt":"An intake of 5,000 ticket lines reports 4,950 accepted and 38 rejected, and exits normally. What should the next action be?","options":[{"key":"A","text":"Ship the 4,950: the numbers are close enough"},{"key":"B","text":"Find the 12 lines that went nowhere"},{"key":"C","text":"Add 12 to the rejected count so the totals match"},{"key":"D","text":"Rerun the intake until the numbers add up"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Accepted plus rejected must equal the input lines; a gap of 12 means some path drops lines without a reason, which is the failure the design exists to prevent.","misconceptions":["Accepts silent loss because it is small","","Makes the report agree without knowing what happened to the lines","The same code on the same input gives the same gap"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-try-placement","type":"single","prompt":"A loader has one try around its whole for loop over 400 lines, with except Rejected adding the line to a log. Line 37 is malformed. How many lines end up accepted or logged?","options":[{"key":"A","text":"37: the loop ends at the first rejection"},{"key":"B","text":"400: the except lets the loop continue"},{"key":"C","text":"399: every line except the bad one"},{"key":"D","text":"36: the bad line is not logged either"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"An exception leaves the try block; when the loop is inside that block the loop is left too. The try must wrap one line's work, inside the loop.","misconceptions":["","Assumes control returns into the loop after the except","Counts the accepted lines of a correct loader, forgetting where the try is","Forgets that the except still runs and logs the line that raised"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-traceback-frame","type":"single","prompt":"A traceback has three frames: the module calling report(), report() calling total(), and total() at the line 'result += to_number(cell)', followed by 'TypeError: unsupported operand type(s) for +=: float and NoneType'. Where do you look first?","options":[{"key":"A","text":"At the module line, the first in the traceback"},{"key":"B","text":"At to_number: when does it return None?"},{"key":"C","text":"At report(), the frame in the middle"},{"key":"D","text":"At total(), to add a try around the line"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The last line says a None was added; the last frame shows it came from to_number's result, so the question is which input makes to_number return None.","misconceptions":["Reads the traceback from the top, where the oldest call is","","Picks a frame without using the message","Hides the symptom where it appears instead of finding where the None comes from"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d3-regression-proof","type":"single","prompt":"You fixed a defect and wrote a regression test, which passes. A reviewer asks how you know the test guards against the defect. What is the strongest answer?","options":[{"key":"A","text":"Its name says it is a regression test"},{"key":"B","text":"It passes on the fixed code"},{"key":"C","text":"It covers the function that was changed"},{"key":"D","text":"It failed before the fix and passes after"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only a test that has been seen to fail on the defect is known to detect it; passing on the fixed code alone is also true of a test that checks nothing.","misconceptions":["A name proves nothing about behaviour","Also true of a test that never could fail","Running through a function is not the same as checking the case that was wrong",""],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-execution-counts","type":"single","prompt":"A colleague sends a saved notebook. Reading down the page, the numbers beside its five code cells are 1, 2, 6, 7 and 5. What does this tell you before you run anything?","options":[{"key":"A","text":"The last cell ran before the two above it last ran"},{"key":"B","text":"The notebook has seven cells and two are hidden"},{"key":"C","text":"The third cell took the longest of all to run"},{"key":"D","text":"It was run top to bottom, and some cells twice"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The numbers record the order of running in that kernel. 5 below 6 and 7 means the bottom cell ran earlier than the last runs of the two above it; the missing 3 and 4 are runs of cells that were run again or deleted.","misconceptions":["","Reads a gap in the counts as cells that exist and cannot be seen","Reads the count as a duration","Reads the counts as how often each cell ran, not as the order of the runs"],"lo":["LO2"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-works-in-my-kernel","type":"single","prompt":"An analyst's notebook has produced the monthly figures for weeks. A colleague opens the same file, chooses 'restart and run all', and the third cell stops with NameError: name 'limits' is not defined. No cell on the page defines limits. What is the most likely history?","options":[{"key":"A","text":"The colleague's Python is an older version"},{"key":"B","text":"The file was damaged when it was sent"},{"key":"C","text":"A deleted cell defined limits in her kernel"},{"key":"D","text":"limits is a setting of the analyst's install"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Deleting a cell removes it from the page and not from the kernel's memory. The notebook kept working in the kernel that had run the cell, and in no other.","misconceptions":["A version difference does not make a name that is defined nowhere appear","A damaged file fails to open; it does not lose one definition cleanly","","Takes a name that lived in one kernel's memory for a property of the installation"],"lo":["LO2"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-choose-home","type":"single","prompt":"Three programs at a utility need the same rule for deciding whether a meter reading is valid: the monthly report, a ticket tool, and a data-quality dashboard. Each currently has its own copy, and the copies have started to differ. Where should the rule live?","options":[{"key":"A","text":"In a notebook that all three teams open"},{"key":"B","text":"In the script of the monthly report, since it was written there first"},{"key":"C","text":"In each program, with a comment that says the copies must be kept the same"},{"key":"D","text":"In a module that the three programs import, with its tests beside it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Code that more than one program needs belongs in an importable module: one definition, one set of tests, and every caller gets the same rule.","misconceptions":["A notebook is for looking at a question; other programs cannot rely on its cells","A script runs a job; importing a rule from it would run the job too, or tie two tools to one report","Leaves the cause in place: copies kept in step by a comment are the copies that already differ",""],"lo":["LO2"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-exit-code","type":"single","prompt":"A scheduled job runs a reporting tool every night and mails the report if the tool succeeded. One night the input file was missing; the tool printed 'no such file', wrote nothing, and the job mailed last night's report again as if it were new. What was missing in the tool?","options":[{"key":"A","text":"A clearer error message for the operator"},{"key":"B","text":"A try around the whole program"},{"key":"C","text":"A non-zero exit code on failure"},{"key":"D","text":"A log file that records each run"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A schedule cannot read messages; it reads the exit code. Zero means 'use the output'. A tool that fails must say so with a non-zero code.","misconceptions":["The message was already clear; the job does not read messages","Catching everything would hide the failure even more thoroughly","","A log helps a person afterwards; the job still cannot tell that the run failed"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-same-bytes","type":"single","prompt":"A command-line tool builds a district report from a month of readings. Run twice on the same files, it writes two reports whose districts appear in a different order. The numbers are the same. Why does this still need repair, and how?","options":[{"key":"A","text":"No repair: the numbers are the same"},{"key":"B","text":"The reports should be compared by eye"},{"key":"C","text":"Run the tool only once per month"},{"key":"D","text":"Write the districts in sorted order"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"If the same input can give different bytes, a difference between two reports says nothing. A fixed order makes 'same input, same output' a property that can be checked by a program.","misconceptions":["Gives up the cheapest check there is: comparing two files","Replaces a check a program can do in a moment by one a person will stop doing","Avoids the comparison instead of making it possible",""],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-log-not-print","type":"single","prompt":"A tool writes its report to a file and also prints progress lines such as 'loading', 'validating' and each rejected customer's ticket text. It will soon run unattended, and its output will be kept. Which change is the sound one?","options":[{"key":"A","text":"Log with levels: counts and file names, no customer text"},{"key":"B","text":"Leave the prints, since nobody will read them"},{"key":"C","text":"Remove every message so the tool is always silent"},{"key":"D","text":"Print the messages into the report file as well"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A log with levels can be turned up or down and keeps the result separate from the commentary. What is logged is kept and copied, so it must not hold personal data.","misconceptions":["","Output that is kept is read some day, by someone, and this output holds customers' words","A tool that says nothing when an input is missing cannot be operated","Mixes commentary into the result, and makes two runs differ"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-boundary-test","type":"single","prompt":"A discount rule says: orders of more than 100 riyals get free delivery. The tests check an order of 30 (no free delivery) and one of 500 (free delivery), and pass. A change turns 'more than' into 'at least'. What happens, and which test was missing?","options":[{"key":"A","text":"The tests fail, since the rule changed"},{"key":"B","text":"The tests still pass; a test for an order of exactly 100 was missing"},{"key":"C","text":"The tests still pass; a test for an order of 0 was missing"},{"key":"D","text":"The tests still pass; more tests in the middle, such as 50 and 60, were missing"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The two rules give different answers at one value only, exactly 100. Examples far from the boundary cannot tell them apart.","misconceptions":["Assumes any change to the code is noticed by the tests that exist","","Zero is an edge of the input, and both rules still agree there","More examples where the rules agree add nothing"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-passing-proves","type":"single","prompt":"A function has twelve tests, and all pass. A colleague concludes: 'The function is correct.' Which statement is the accurate one?","options":[{"key":"A","text":"It is right on those twelve examples"},{"key":"B","text":"Correct, since there are more than ten tests"},{"key":"C","text":"Nothing at all can be concluded from tests"},{"key":"D","text":"Correct, if the type checker is also clean"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Tests are evidence about examples. They are valuable because they are cheap and repeatable, and they say nothing about cases outside them.","misconceptions":["","Counts tests instead of asking what they would catch","Throws away real evidence because it is not a proof","A type checker rules out one kind of mistake; a wrong formula with the right types passes both"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-hint-not-answer","type":"single","prompt":"A trainee is learning to debug. A function returns a wrong total; the trainee has reproduced it with three numbers and suspects the loop. An AI assistant is available. Which request best keeps the skill being learnt with the trainee?","options":[{"key":"A","text":"'Rewrite this function so that it gives the right total.'"},{"key":"B","text":"'Which line of this function is wrong? I will fix it myself.'"},{"key":"C","text":"'1, 2, 3 gives 5, not 6; I think the loop skips one. What could I print?'"},{"key":"D","text":"'Write tests for this function so that I can find the bug.'"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The request states what was expected, what was seen and a hypothesis, and asks for a way to test it. The reasoning stays with the trainee; the assistant supplies a next step.","misconceptions":["Hands over the fix, and with it the whole method","Hands over the hypothesis, the step in which the understanding is formed","","Useful work, and it moves the judgement of what the function should do to the assistant"],"lo":["LO5"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-d4-paste-data","type":"single","prompt":"An analyst at a utility is debugging a script that crashes on one customer's ticket. To get help, the analyst is about to paste the script and the ticket, with the customer's name, phone number and complaint, into a public AI assistant. What is the sound way to get the same help?","options":[{"key":"A","text":"Paste it: it is only one customer"},{"key":"B","text":"Paste it, then ask it to forget the ticket"},{"key":"C","text":"Paste it after removing the name only"},{"key":"D","text":"Ask about a small invented input instead"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A ticket with a phone number and a complaint is personal data and must not go to a service the organisation has not approved. A shrunk, invented case shows the same defect and holds nobody's data.","misconceptions":["One person's data is still personal data","A request in a prompt is not a control the analyst can verify","The phone number and the complaint still identify the customer",""],"lo":["LO4"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-x-trace-nested-share","type":"single","prompt":"A program runs: week = [0, 0]; month = [week, week]; month[0][1] = 5; print(month[1]). What is printed, and why?","options":[{"key":"A","text":"[0, 5], because both items of month are the same list"},{"key":"B","text":"[0, 0], because only the first item was changed"},{"key":"C","text":"[5, 0], because the index 1 means the first position"},{"key":"D","text":"An error, because a list cannot hold a list twice"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"month holds two references to the one list named week. A change made through month[0] is seen through month[1], and through week.","misconceptions":["","Assumes that putting a list into another list copies it","Counts positions from 1","Assumes that an object can be referred to from one place only"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-x-trace-scope","type":"single","prompt":"A program runs: limit = 200, then a function def check(value): limit = 100; return value > limit, then print(check(150), limit). What is printed?","options":[{"key":"A","text":"False 200"},{"key":"B","text":"True 100"},{"key":"C","text":"False 100"},{"key":"D","text":"True 200"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The assignment inside the function binds a local name limit to 100, so 150 > 100 is True. The global limit is untouched and is still 200.","misconceptions":["Uses the global 200 inside the function, as if the local assignment had not happened","Assumes the assignment inside the function changes the global name","Mixes both mistakes: the global value for the comparison and the local one for the print",""],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-x-home-explore","type":"single","prompt":"A metering analyst receives a file format she has never seen and wants to find out, today, which of its forty columns are filled and what the values look like. She does not know yet whether she will ever do it again. Which home fits the task?","options":[{"key":"A","text":"A module with one function per column, and tests"},{"key":"B","text":"A script with arguments for the file and the columns"},{"key":"C","text":"A notebook: she is looking, one step at a time"},{"key":"D","text":"A package with a command-line entry point"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The steps are unknown and each result decides the next step: that is exploration, a notebook's strength. If the job repeats, what survives moves into a script.","misconceptions":["Builds shared, tested code for a question nobody has asked twice","Fixes the steps before they are known","","The most machinery of the four, for a task that may never recur"],"lo":["LO2"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-x-home-notebook-in-production","type":"single","prompt":"A team's weekly figures come from a notebook that one analyst runs by hand. Twice this quarter the figures were wrong because a cell had been skipped. The steps have not changed for months. What is the sound next move?","options":[{"key":"A","text":"Add a note at the top: run all cells in order"},{"key":"B","text":"Have a second analyst run it and compare"},{"key":"C","text":"Restart and run all before every weekly run"},{"key":"D","text":"Move the steps into a module and a script"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Steps that are stable and repeated belong in a script on top of a module: every run starts empty and runs everything, in one order.","misconceptions":["Relies on the habit that already failed twice","Doubles the manual work and keeps the cause","Keeps the steps in a notebook run by hand, so a person still has to remember the habit",""],"lo":["LO2"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-x-cli-argument-default","type":"single","prompt":"A reporting tool has the threshold 3.0 written inside a function. Analysts sometimes need 2.5, and each time someone edits the file, runs it, and forgets to change it back. What should the tool offer?","options":[{"key":"A","text":"An argument --factor with 3.0 as its default, shown by --help"},{"key":"B","text":"A second copy of the tool with 2.5 in it"},{"key":"C","text":"A question that the tool asks on every run, waiting for an answer"},{"key":"D","text":"A comment beside the number that says: remember to change it back"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A setting that changes between runs is an argument with a default: the usual run needs nothing extra, the unusual one is visible in the command, and no file is edited.","misconceptions":["","Two copies drift apart, and the next threshold needs a third","A tool that waits for an answer cannot run on a schedule","Leaves the editing of code as the way to use the tool"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"}]}</script>
