[project]
name = "manahil-labs"
version = "2027.1.0"
description = "The lab workspace of FN-101 Python for Data and AI Work"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
